# CI (REQ-BT04): shared contract + Android unit tests and lint on every push.
# The Connect IQ SDK is not installable headlessly here, so the watch build stays local.
name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install --no-interaction
      - run: poetry run black --check src tests
      - run: poetry run mypy src
      - run: poetry run pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which current cmdline-tools no
          # longer has ("Failed to find package 'tools'"); AGP downloads build-tools/platforms itself.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain :domain:test :app:testDebugUnitTest :app:lintDebug
