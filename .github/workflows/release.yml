# Release (REQ-BT05): every merge to main (a push to main) publishes a GitHub Release with the
# WOD Capture APK, after the unit tests pass. The tag is v<versionName> from
# android/app/build.gradle.kts; if that tag already exists (version not bumped) the release is
# tagged v<versionName>-<short sha> and marked as a pre-release.
#
# Signing: set these repository secrets to get an APK signed with your own key, so every release
# installs over the previous one:
#   RELEASE_KEYSTORE_BASE64  base64 of the .jks keystore
#   RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Without them the debug APK is attached instead. A CI runner makes a new debug key each run, so
# such builds cannot update each other (or a locally built debug app) without an uninstall.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Releases are published one at a time, in merge order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the collision check and the generated notes need them
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Version and tag
        id: version
        run: |
          name="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts)"
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::versionName/versionCode not found in android/app/build.gradle.kts"
            exit 1
          fi
          tag="v$name"
          prerelease=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::warning::$tag already exists (versionName not bumped); releasing as a pre-release"
            tag="v$name-${GITHUB_SHA::7}"
            prerelease=true
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "apk=$RUNNER_TEMP/wod-capture-$tag.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew --console=plain :domain:test :app:testDebugUnitTest

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          ./gradlew --console=plain :app:assembleRelease
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$APK" app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/apksigner" verify "$APK"
          rm -f "$keystore"

      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          ./gradlew --console=plain :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            signing="Signed with the release key: installs over the previous release."
          else
            signing="Debug-signed (no release keystore secrets yet): uninstall the previous build before installing."
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "WOD Capture $NAME" \
            --notes "WOD Capture $NAME (versionCode $CODE). $signing" \
            --generate-notes \
            "${flags[@]}"
